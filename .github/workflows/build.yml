name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Verify counting and persistence
        shell: powershell
        run: .\verify.ps1
      - name: Export source and portable packages
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeBuddyStudio-windows-x64
          path: work/packages/*.zip
          if-no-files-found: error
